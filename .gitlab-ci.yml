workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"

image: "vgitlab01.tq-net.de:5005/tq-embedded/tqmaxx/toolchain-tqmaxx/bare:ubuntu-22.04"

variables:
  SM_CROSS_COMPILE: "/opt/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-"
  BUILDDIR: build

stages:
  - build

compile:
  tags:
    - docker
    - tqmaxx
  stage: build
  parallel:
    matrix:
      - MACHINE:
        - mx94evk
        - mx95evk
        - tqma94xxla-2gb
        - tqma95xxla-4gb
        - tqma95xxsa-2gb
        - tqma95xxsa-2gb-m7
        - tqma95xxsa-4gb
        - tqm943l02g0c000
        - tqm95_l04g0c000
        - tqm95_s02g0c000
        - tqm95_s02g0c001
        - tqm95_s04g0c000
        CONFIG: ["t=all m=0", "m=1", "m=0 c=1", "m=0 c=0" ]
  script:
    - echo "Building ${MACHINE} with ${CONFIG}"
    - make -j$(nproc) config=${MACHINE} ${CONFIG} all
  artifacts:
    when: on_success
    paths:
      - "${BUILDDIR}/${MACHINE}/m33*.bin"
      - "${BUILDDIR}/${MACHINE}/m33*.elf"
      - "${BUILDDIR}/${MACHINE}/build_info.h"
  interruptible: true
